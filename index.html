<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Менеджер задач</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body> 
    <div id="stats">Всего: 0 | Выполнено: 0 | Активных: 0</div>

    
    <div class = "input-group">
        <!-- Поле ввода -->
        <input placeholder="Введите задачу..." type="text" name="text" class="input">
        
        <!-- Добавить -->
        <button class="add-button">
            <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z">
                </path>
            </svg>
            <span class="text">Добавить</span>
            <span class="circle"></span>
            <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z">
                </path>
            </svg>
        </button>
    </div>


    <div id="filters">
        <button data-filter="all">Все</button>
        <button data-filter="active">Активные</button>
        <button data-filter="completed">Выполненные</button>
    </div>


    <ul id="taskList">
        
        <li class="task-item">
            <div class="task-left">
                <input type="checkbox" class="task-checkbox" data-id="1">
                <span class="task-text">Купить хлеб</span>
            </div>
            <button class="btn-delete" data-id="1">✕</button>
        </li>

        <li class="task-item">
            <div class="task-left">
                <input type="checkbox" class="task-checkbox" data-id="1">
                <span class="task-text">Купить хлеб</span>
            </div>
            <button class="btn-delete" data-id="1">✕</button>
        </li>

        <li class="task-item">
            <div class="task-left">
                <input type="checkbox" class="task-checkbox" data-id="1">
                <span class="task-text completed">Купить хлеб</span>
            </div>
            <button class="btn-delete" data-id="1">✕</button>
        </li>
        

    </ul>


    <button id="clearCompleted">Очистить выполненные</button>
    </div>





    <script>
    let tasks = [];
        let nextId = 1;
        let currentFilter = 'all';


        // поле ввода
        const taskInput = document.querySelector('.input');

        // кнопка "Добавить"
        const addButton = document.querySelector('.add-button');

        // список задач
        const taskList = document.getElementById('taskList');

        // блок статистики
        const stats = document.getElementById('stats')

        // контейнер с кнопками
        const filters = document.getElementById('filters')

        // кнопка "Очистить выполненные задачи"
        const clearCompletedBtn = document.getElementById('clearCompleted')


        function addTask() {
            let text = taskInput.value;
            if (text.trim() === "") {
                alert("Введите текст.")
            }

            else {
                let newTask = {
                    id: nextId,
                    text: text.trim(),
                    completed: false
                };

                tasks.push(newTask)
                nextId++
                alert("Задача добавлена")

                taskInput.value = ''
                renderTasks();
                updateStats();
            }

        }


        function renderTasks() {
            taskList.innerHTML = '';  // Очистить список
            let filteredTasks = [];
            if (currentFilter == "all") {
                filteredTasks = tasks;
            }

            else if (currentFilter == 'active') {
                filteredTasks = tasks.filter(t => !t.completed)
            }

            else if (currentFilter == 'completed') {
                filteredTasks = tasks.filter(t => t.completed)
            }


            for (let i = 0; i < filteredTasks.length; i++) {
                const li = document.createElement('li');
                li.className = 'task-item';
                li.innerHTML = `
            <input type="checkbox" class="task-checkbox" data-id="${filteredTasks[i].id}" ${filteredTasks[i].completed ? 'checked' : ''}>
            <span class="task-text ${filteredTasks[i].completed ? 'completed' : ''}">${filteredTasks[i].text}</span>
            <button class="btn-delete" data-id="${filteredTasks[i].id}">Удалить</button>
             `;
                taskList.appendChild(li);
            }

            updateStats();

        }


        function updateStats() {
            let allTasks = tasks.length;
            let completedTasks = tasks.filter(t => t.completed).length;
            let activeTasks = tasks.filter(t => !t.completed).length;

            stats.textContent = `Всего: ${allTasks} | Выполнено: ${completedTasks} | Активных: ${activeTasks}`


        }


        function toggleTask(id) {
            for (let i = 0; i < tasks.length; i++) {
                if (tasks[i].id === id) {
                    tasks[i].completed = !tasks[i].completed;
                    break;
                }
            }
            renderTasks();
            updateStats();

        }
        function deleteTask(id) {
            for (let i = 0; i < tasks.length; i++) {
                if (tasks[i].id === id) {
                    tasks.splice(i, 1)
                    break;
                }
            }
            renderTasks();
            updateStats();
        }






        //Удаление и отметка задачи как "Выполненная"
        taskList.addEventListener('click', function (e) {
            if (e.target.matches('.task-checkbox')) {
                let id = Number(e.target.dataset.id)
                toggleTask(id)
            }

            if (e.target.matches('.btn-delete')) {
                let id = Number(e.target.dataset.id)
                deleteTask(id)
            }
        });

        //Добавление задачи
        addButton.addEventListener('click', addTask);

        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });


        clearCompletedBtn.addEventListener('click', function (e) {

            tasks = tasks.filter(function (task) {
                return task.completed === false;
            })
            renderTasks();
            updateStats();

        });    
    </script>
</body>

</html>
